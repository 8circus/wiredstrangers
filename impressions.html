<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressions - Wired Strangers</title>
<meta name="description" content="Wired Strangers - studio sessions and Tour de la Musique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --black: #080502;
    --paper: #f0e8d4;
    --muted: #7a6e62;
    --amber-lit: #c98a3e;
    --warm-dark: #120d08;
    --hairline: rgba(240,232,212,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }

  .brand {
    font-family: 'Pacifico', cursive;
    letter-spacing: 0.01em;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 28px;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    mix-blend-mode: difference;
  }

  .nav-brand { font-size: 1.05rem; }
  .nav-links { display: flex; gap: 22px; }
  .nav-links a { opacity: 0.85; transition: opacity 0.2s; }
  .nav-links a:hover { opacity: 1; }

  /* PAGE HEADER */
  .page-header {
    padding: 140px 28px 60px;
    border-bottom: 1px solid var(--hairline);
  }

  .page-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.3rem, 3vw, 2rem);
    color: var(--paper);
    margin-bottom: 10px;
  }

  .page-sub {
    color: var(--muted);
    font-size: 0.95rem;
    max-width: 44ch;
    line-height: 1.55;
  }

  /* PHOTO SECTIONS */
  .photo-section {
    padding: 80px 0;
    border-bottom: 1px solid var(--hairline);
  }
  .photo-section:first-of-type {
    padding-top: 130px;
  }

  .section-header {
    padding: 0 28px;
    margin-bottom: 36px;
  }

  .section-title {
    font-family: 'Inter', sans-serif;
    font-size: clamp(0.95rem, 2vw, 1.35rem);
    font-weight: 600;
    color: var(--paper);
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }
  .nav-active {
    opacity: 1 !important;
    border-bottom: 1px solid rgba(240,232,212,0.5);
    padding-bottom: 1px;
  }

  .section-sub {
    color: var(--muted);
    font-size: 0.88rem;
    letter-spacing: 0.02em;
  }

  /* MASONRY GRID */
  .masonry {
    columns: 3;
    column-gap: 8px;
    padding: 0 28px;
  }

  .photo-item {
    break-inside: avoid;
    margin-bottom: 8px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  .photo-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                filter 0.45s ease;
    filter: brightness(0.92) saturate(0.9);
  }

  .photo-item:hover img {
    transform: scale(1.04);
    filter: brightness(1.04) saturate(1.1);
  }

  /* SECTION DIVIDER */
  .section-divider {
    padding: 70px 28px 0;
    border-top: 1px solid var(--hairline);
    margin-top: 0;
  }

  /* FOOTER */
  footer {
    padding: 60px 28px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .footer-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 2px;
    transition: color 0.2s;
  }

  .footer-back:hover { color: var(--paper); }

  .footer-copy {
    color: var(--muted);
    font-size: 0.8rem;
  }

  /* MOBILE */
  @media (max-width: 900px) {
    .masonry { columns: 2; }
  }

  @media (max-width: 560px) {
    .masonry { columns: 1; column-gap: 0; padding: 0 14px; }
    .section-header { padding: 0 14px; }
    .page-header { padding: 120px 14px 48px; }
    nav { padding: 18px 14px; }
    footer { padding: 48px 14px 32px; }
    .nav-links { gap: 14px; }
  }

</style>
</head>
<body>

<nav>
  <a href="index.html" class="brand nav-brand">Wired Strangers</a>
  <div class="nav-links">
    <span class="nav-active">Impressions</span>
    <a href="index.html#contact">Contact</a>
  </div>
</nav>

<section id="studio" class="photo-section">
  <div class="section-header wrap" style="max-width:none;">
    <div class="wrap">
      <h2 class="section-title">Recording at Number Nine Studios</h2>
      <p class="section-sub">Debut album coming soon</p>
    </div>
  </div>
  <div class="masonry wrap" style="max-width:none; padding: 0 28px;">
      <div class="photo-item"><img src="images/studio-1.jpg" alt="Studio recording 1" loading="lazy"></div>
      <div class="photo-item"><img src="images/studio-2.jpg" alt="Studio recording 2" loading="lazy"></div>
      <div class="photo-item"><img src="images/studio-3.jpg" alt="Studio recording 3" loading="lazy"></div>
      <div class="photo-item"><img src="images/studio-4.jpg" alt="Studio recording 4" loading="lazy"></div>
      <div class="photo-item"><img src="images/studio-5.jpg" alt="Studio recording 5" loading="lazy"></div>
      <div class="photo-item"><img src="images/studio-6.jpg" alt="Studio recording 6" loading="lazy"></div>
      <div class="photo-item"><img src="images/studio-7.jpg" alt="Studio recording 7" loading="lazy"></div>
  </div>
</section>

<section id="tour" class="photo-section" style="border-bottom: none;">
  <div class="section-header wrap" style="max-width:none;">
    <div class="wrap">
      <h2 class="section-title">Tour de la Musique</h2>
      <p class="section-sub">1000km to Montpellier. Solar stages, cargo bikes and music on the streets.</p>
    </div>
  </div>
  <div class="masonry wrap" style="max-width:none; padding: 0 28px;">
      <div class="photo-item"><img src="images/tour-1.jpg" alt="Tour de la Musique 1" loading="lazy"></div>
      <div class="photo-item"><img src="images/tour-2.jpg" alt="Tour de la Musique 2" loading="lazy"></div>
      <div class="photo-item"><img src="images/tour-3.jpg" alt="Tour de la Musique 3" loading="lazy"></div>
      <div class="photo-item"><img src="images/tour-4.jpg" alt="Tour de la Musique 4" loading="lazy"></div>
      <div class="photo-item"><img src="images/tour-5.jpg" alt="Tour de la Musique 5" loading="lazy"></div>
      <div class="photo-item"><img src="images/tour-6.jpg" alt="Tour de la Musique 6" loading="lazy"></div>
  </div>
</section>

<footer>
  <a href="index.html" class="footer-back">Back to main page</a>
  <span class="footer-copy">&copy; 2026 Wired Strangers, Gent - <a href="https://8circus.be" style="color:inherit; opacity:0.6; text-decoration:none; border-bottom: 1px solid rgba(240,224,204,0.2);">8circus records</a></span>
</footer>

</body>
</html>
